}

/* ============================================================
   COMPARACIÓN VS COMUNA
   Genera el HTML de la sección que compara este terreno con
   los demás terrenos de su misma comuna en la base.
   ============================================================ */
function buildComparisonHtml(t){
  var comuna = g(t,'comuna');
  if(!comuna) return '<div class="no-data">Sin comuna registrada</div>';

  // Si el terreno tiene tipo definido, comparamos solo contra terrenos del mismo tipo
  // (no tiene sentido comparar UF/m² de casa contra deptos)
  var enComuna = allTerrains.filter(function(x){
    if(g(x,'comuna')!==comuna) return false;
    if(t._tipo && x._tipo) return x._tipo===t._tipo;
    return true; // si alguno no tiene tipo, lo incluimos
  });

  var tipoLabel = '';
  if(t._tipo==='departamento') tipoLabel = ' (deptos)';
  else if(t._tipo==='casa') tipoLabel = ' (casas)';

  // Si solo está este terreno, no hay con qué comparar
  if(enComuna.length<=1){
    return '<div class="no-data">Es el único terreno'+tipoLabel+' registrado en '+comuna+'. Necesitas al menos 2 para comparar.</div>';
  }

  // Función para calcular stats de una métrica
  function statsDe(getter){
    var vals = enComuna.map(getter).filter(function(v){return v>0;});
    if(!vals.length) return null;
    var sorted = vals.slice().sort(function(a,b){return a-b;});
    var sum = vals.reduce(function(a,b){return a+b;},0);
    return {
      promedio: sum/vals.length,
      mediana: sorted.length%2 ? sorted[Math.floor(sorted.length/2)] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2,
      n: vals.length,
      min: sorted[0],
      max: sorted[sorted.length-1]
    };
  }

  // Formatea un valor según métrica (con redondeo razonable)
  function fmt(v, tipo){
    if(!v && v!==0) return '—';
    if(tipo==='m2') return Math.round(v).toLocaleString('es-CL')+' m²';
    if(tipo==='uf') return 'UF '+Math.round(v).toLocaleString('es-CL');
    if(tipo==='ufm2') return (Math.round(v*10)/10).toLocaleString('es-CL');
    return v;
  }

  // Calcula pill de delta (% de diferencia respecto a la mediana)
  // Para precio: barato es bueno (verde), caro es malo (rojo)
  // Para superficie: no hay "bueno" o "malo", solo gris informativo
  function deltaPill(valor, ref, esPrecio){
    if(!valor || !ref) return '<span class="cmp-delta flat">—</span>';
    var diff = ((valor-ref)/ref)*100;
    var absDiff = Math.abs(Math.round(diff));
    var sign = diff>0 ? '+' : (diff<0 ? '−' : '');
    var clase = 'flat';
    if(esPrecio){
      if(diff < -2) clase = 'cheap';
      else if(diff > 2) clase = 'expensive';
    }
    if(absDiff===0) return '<span class="cmp-delta flat">=</span>';
    return '<span class="cmp-delta '+clase+'">'+sign+absDiff+'%</span>';
  }

  var statsM2 = statsDe(function(x){return x._m2;});
  var statsUF = statsDe(function(x){return x._uf;});
  var statsUFm2 = statsDe(function(x){return x._uf_m2;});

  // Ranking del terreno actual en UF/m² (1 = más barato)
  var rankInfo = '';
  var bestCard = '';
  if(t._uf_m2>0 && statsUFm2){
    var ufm2List = enComuna
      .map(function(x){return {id:x._id, val:x._uf_m2, terreno:x};})
      .filter(function(x){return x.val>0;})
      .sort(function(a,b){return a.val-b.val;});
    var rank = ufm2List.findIndex(function(x){return x.id==t._id})+1;
    if(rank>0){
      rankInfo = '<div class="cmp-summary">Este terreno está en la posición <span class="cmp-rank">#'+rank+' de '+ufm2List.length+'</span> en UF/m² dentro de '+comuna+' (1 = más barato).</div>';
    }

    // Tarjeta del más barato de la comuna
    var cheapest = ufm2List[0];
    if(cheapest){
      var b = cheapest.terreno;
      var bAddr = g(b,'direccion') || 'Sin dirección';
      var bUFm2 = b._uf_m2 || 0;
      var bM2 = b._m2 ? Math.round(b._m2).toLocaleString('es-CL')+' m²' : '—';
      var bUF = b._uf ? 'UF '+Math.round(b._uf).toLocaleString('es-CL') : '—';

      if(b._id == t._id){
        // El terreno actual ES el más barato
        bestCard = '<div class="cmp-best is-current">'+
          '<div class="cmp-best-icon">🏆</div>'+
          '<div class="cmp-best-body">'+
            '<div class="cmp-best-label">El más barato de '+comuna+'</div>'+
            '<div class="cmp-best-addr">Este terreno lidera el ranking</div>'+
            '<div class="cmp-best-stats">No hay otro con UF/m² menor en la base.</div>'+
          '</div>'+
        '</div>';
      } else {
        // Mostrar el más barato + comparación con el actual
        var diffPct = t._uf_m2>0 ? Math.round(((t._uf_m2-bUFm2)/bUFm2)*100) : 0;
        var diffText = '';
        if(diffPct > 0){
          diffText = '<div class="cmp-best-vs">Tu terreno está <strong>'+diffPct+'% más caro</strong> en UF/m².</div>';
        } else if(diffPct < 0){
          // No debería pasar porque el actual no es el más barato, pero por si acaso
          diffText = '<div class="cmp-best-vs">Tu terreno está '+Math.abs(diffPct)+'% más barato en UF/m².</div>';
        }

        bestCard = '<div class="cmp-best" onclick="selectTerrain('+b._id+')">'+
          '<div class="cmp-best-icon">🏆</div>'+
          '<div class="cmp-best-body">'+
            '<div class="cmp-best-label">El más barato de '+comuna+'</div>'+
            '<div class="cmp-best-addr">'+bAddr+'</div>'+
            '<div class="cmp-best-stats">'+
              '<span class="b-ufm2">UF/m² '+(Math.round(bUFm2*10)/10)+'</span>'+
              '<span>·</span>'+
              '<span>'+bM2+'</span>'+
              '<span>·</span>'+
              '<span>'+bUF+'</span>'+
            '</div>'+
            diffText+
          '</div>'+
          '<div class="cmp-best-arrow">→</div>'+
        '</div>';
      }
    }
  }

  // Detectar si hay outliers (promedio y mediana muy separados en UF/m²)
  var spreadWarn = '';
  if(statsUFm2 && statsUFm2.promedio && statsUFm2.mediana){
    var spread = Math.abs(statsUFm2.promedio - statsUFm2.mediana) / statsUFm2.mediana;
    if(spread > 0.15){
      spreadWarn = '<div class="cmp-spread-warn">⚠ Promedio y mediana difieren mucho ('+Math.round(spread*100)+'%). Hay outliers en la muestra.</div>';
    }
  }

  // Construir filas de la tabla
  function fila(label, valor, stats, tipo, esPrecio){
    if(!stats) return '<tr><td>'+label+'</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>';
    return '<tr>'+
      '<td>'+label+'</td>'+
      '<td class="num terreno-val">'+fmt(valor,tipo)+'</td>'+
      '<td class="num">'+fmt(stats.promedio,tipo)+'</td>'+
      '<td class="num">'+fmt(stats.mediana,tipo)+'</td>'+
      '<td class="num">'+deltaPill(valor, stats.mediana, esPrecio)+'</td>'+
    '</tr>';
  }

  return rankInfo+
    '<table class="cmp-table">'+
      '<thead><tr>'+
        '<th>Métrica</th>'+
        '<th>Este terreno</th>'+
        '<th>Promedio</th>'+
        '<th>Mediana</th>'+
        '<th>vs mediana</th>'+
      '</tr></thead>'+
      '<tbody>'+
        fila('Superficie', t._m2, statsM2, 'm2', false)+
        fila('Precio total', t._uf, statsUF, 'uf', true)+
        fila('UF / m²', t._uf_m2, statsUFm2, 'ufm2', true)+
      '</tbody>'+
    '</table>'+
    spreadWarn+
    '<div style="font-size:10px;font-family:var(--font-mono);color:var(--text-faint);margin-top:8px">Comparación contra '+(enComuna.length-1)+' otro'+(enComuna.length-1!==1?'s':'')+' terreno'+(enComuna.length-1!==1?'s':'')+' de '+comuna+tipoLabel+'</div>';
}

/* ============================================================
   FIJAR TERRENO
   Aísla un terreno: solo ese se muestra en mapa y sidebar.
   El dashboard sigue mostrando todos (panorama general).
   ============================================================ */
function togglePinTerrain(id){
  if(pinnedId === id){
    unpinTerrain();
  } else {
    pinTerrain(id);
  }
}

function pinTerrain(id){
  var t = allTerrains.find(function(x){return x._id===id;});
  if(!t) return;
  pinnedId = id;
  applyFilters();
  // Mostrar la banda superior
  updatePinBanner();
  // Actualizar el botón del detalle
  updatePinButton();
  // Hacer zoom al terreno
  if(t._lat && t._lng){
    map.flyTo([t._lat, t._lng], 16, {duration: 1.0, easeLinearity: 0.25});
  }
}

function unpinTerrain(){
  pinnedId = null;
  applyFilters();
  updatePinBanner();
  updatePinButton();
}

function updatePinBanner(){
  var banner = document.getElementById('pin-banner');
  if(!banner) return;
  if(pinnedId!==null){
    var t = allTerrains.find(function(x){return x._id===pinnedId;});
    if(t){
      var addr = g(t,'direccion') || 'Sin dirección';
      banner.querySelector('#pin-banner-text').textContent = 'Mostrando solo: ' + addr;
      banner.style.display = 'flex';
    }
  } else {
    banner.style.display = 'none';
  }
}

function updatePinButton(){
  var btn = document.getElementById('pin-trigger-btn');
  if(!btn) return;
  if(!selectedId) return;
  var isPinned = pinnedId === selectedId;
  btn.classList.toggle('active', isPinned);
  var label = btn.querySelector('.pt-label');
  if(label){
    label.textContent = isPinned ? 'Quitar fijación' : 'Fijar este terreno';
  }
}

/* --- UTILIDADES DE CÁLCULO --- */
function median(arr){
  if(!arr.length) return 0;
  var s=arr.slice().sort(function(a,b){return a-b;});
  var m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}
function mean(arr){ return arr.length?arr.reduce(function(a,b){return a+b;},0)/arr.length:0; }
function round(n,d){ d=d||1; var p=Math.pow(10,d); return Math.round(n*p)/p; }
function fmtNum(n){ return n?Math.round(n).toLocaleString('es-CL'):'0'; }
function fmtUF(n){ return n?round(n,1).toLocaleString('es-CL'):'—'; }

/* Agrupa por llave */
function groupBy(arr,fn){
  var o={};
  arr.forEach(function(x){ var k=fn(x); if(!o[k])o[k]=[]; o[k].push(x); });
  return o;
}

/* Filtra por rango de fechas arbitrario (sobre allTerrains) */
function terrainsInRange(from,to){
  return allTerrains.filter(function(t){
    if(!t._fecha) return false;
    if(from && t._fecha<from) return false;
    if(to && t._fecha>to) return false;
    return true;
  });
}

/* --- RENDER PRINCIPAL --- */
function renderDashboard(){
  // El dashboard ignora la fijación: muestra panorama general según filtros normales.
  // Si hay pinnedId, igualmente calculamos como si no estuviera fijado.
  var data;
  if(pinnedId!==null){
    // Recomputar igual que applyFilters pero sin el pin
    var searchEl=document.getElementById('float-search');
    var q=searchEl?searchEl.value.toLowerCase():'';
    data=allTerrains.filter(function(t){
      var mf = activeFilter==='todos' || t._resultado===activeFilter;
      var mq=!q||g(t,'direccion').toLowerCase().indexOf(q)>=0||
        g(t,'comuna').toLowerCase().indexOf(q)>=0||
        g(t,'comentario').toLowerCase().indexOf(q)>=0||
        g(t,'resultado').toLowerCase().indexOf(q)>=0||
        g(t,'estado').toLowerCase().indexOf(q)>=0;
      var md = true;
      if(dateFrom || dateTo){
        if(!t._fecha){ md=false; }
        else {
          if(dateFrom && t._fecha < dateFrom) md=false;
          if(dateTo && t._fecha > dateTo) md=false;
        }
      }
      return mf && mq && md;
    });
  } else {
    data = filtered;
  }

  // Aplicar filtro de tipo (Casas/Deptos) si está activo. Solo afecta al dashboard.
  if(tipoFilter!=='todos'){
    data = data.filter(function(t){ return t._tipo===tipoFilter; });
  }

  // Actualizar scope en header
  var scopeParts=[];
  scopeParts.push(data.length+' terreno'+(data.length!==1?'s':''));
  if(dateFrom||dateTo){
    var f=dateFrom?dateFrom.toLocaleDateString('es-CL',{day:'numeric',month:'short'}):'inicio';
    var t=dateTo?dateTo.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'}):'hoy';
    scopeParts.push(f+' → '+t);
  } else {
    scopeParts.push('histórico completo');
  }
  if(activeFilter!=='todos'){
    var filterLabel = activeFilter==='positivo' ? 'aprobado' : activeFilter;
    scopeParts.push('filtro: '+filterLabel);
  }
  if(tipoFilter!=='todos'){
    scopeParts.push('tipo: '+(tipoFilter==='departamento'?'departamentos':'casas'));
  }
  document.getElementById('dash-scope').textContent=scopeParts.join(' · ');

  var body=document.getElementById('dash-body');

  if(!data.length){
    body.innerHTML='<div style="text-align:center;padding:80px 20px"><div style="font-family:var(--font-serif);font-size:20px;margin-bottom:8px">Sin datos para mostrar</div><div style="font-size:13px;color:var(--text-muted)">Ajusta los filtros o el rango de fechas</div></div>';
    return;
  }

  body.innerHTML =
    renderPipelineSection(data) +
    renderProductivitySection() +
    renderPricesSection(data) +
    renderGeoSection(data) +
    renderLeadersSection(data) +
    renderBrokersSection(data) +
    renderEvolutionSection(data);

  // Dibujar el gráfico de evolución si existe contenedor
  setTimeout(function(){ drawEvolutionChart(data); }, 50);
}

/* --- 01. PIPELINE --- */
function renderPipelineSection(data){
  var total = data.length;
  var analizando = data.filter(function(t){return t._resultado==='analizando';}).length;
  var rechazado = data.filter(function(t){return t._resultado==='rechazado';}).length;
  var positivo = data.filter(function(t){return t._resultado==='positivo';}).length;
  var evaluados = analizando + rechazado + positivo;
  var tasaRechazo = evaluados ? Math.round(rechazado/evaluados*100) : 0;
  var tasaAprobacion = evaluados ? Math.round(positivo/evaluados*100) : 0;

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">01</span><span class="dash-sec-title">Pipeline</span></div>'+
    '<div class="dash-sec-sub">Estado actual de tu portafolio de análisis</div>'+
    '<div class="kpi-grid">'+
      kpiCard('Terrenos totales', total, '', 'En el filtro actual', '') +
      kpiCard('En análisis', analizando, '', 'Pipeline activo · click para filtrar', 'amber', null, 'analizando') +
      kpiCard('Aprobados', positivo, '', tasaAprobacion+'% de evaluados · click para filtrar', 'green', null, 'positivo') +
      kpiCard('Tasa de rechazo', tasaRechazo, '%', rechazado+' de '+evaluados+' evaluados · click para filtrar', 'red', null, 'rechazado') +
    '</div>'+
  '</div>';
}

/* --- 02. PRODUCTIVIDAD --- */
function renderProductivitySection(){
  var hoy = new Date();
  var inicioSemana = new Date(hoy); inicioSemana.setDate(hoy.getDate()-7);
  var inicioMes = new Date(hoy); inicioMes.setDate(hoy.getDate()-30);
  var hace4Semanas = new Date(hoy); hace4Semanas.setDate(hoy.getDate()-28);

  // Período actual
  var estaSemana = terrainsInRange(inicioSemana,hoy).length;
  var esteMes = terrainsInRange(inicioMes,hoy).length;

  // Promedio semanal últimas 4 semanas
  var ultimas4 = terrainsInRange(hace4Semanas,hoy).length;
  var promSemanal = round(ultimas4/4,1);

  // Período anterior para comparar (30-60 días atrás)
  var hace60 = new Date(hoy); hace60.setDate(hoy.getDate()-60);
  var mesAnterior = terrainsInRange(hace60,inicioMes).length;
  var delta = mesAnterior===0 ? null : Math.round((esteMes-mesAnterior)/mesAnterior*100);

  var deltaHtml='';
  if(delta===null){
    deltaHtml='<div class="kpi-delta flat">sin base de comparación</div>';
  } else if(delta>0){
    deltaHtml='<div class="kpi-delta up">↑ '+delta+'% vs mes anterior</div>';
  } else if(delta<0){
    deltaHtml='<div class="kpi-delta down">↓ '+Math.abs(delta)+'% vs mes anterior</div>';
  } else {
    deltaHtml='<div class="kpi-delta flat">= vs mes anterior</div>';
  }

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">02</span><span class="dash-sec-title">Tu productividad</span></div>'+
    '<div class="dash-sec-sub">Ritmo de análisis. Independiente del filtro de fechas actual.</div>'+
    '<div class="kpi-grid">'+
      kpiCard('Esta semana', estaSemana, '', 'Últimos 7 días', '') +
      kpiCard('Este mes', esteMes, '', 'Últimos 30 días', '', deltaHtml) +
      kpiCard('Promedio semanal', promSemanal, '', 'Últimas 4 semanas', '') +
      kpiCard('Mes anterior', mesAnterior, '', '30 a 60 días atrás', '') +
    '</div>'+
  '</div>';
}

/* --- 03. PRECIOS --- */
function renderPricesSection(data){
  var ufm2 = data.map(function(t){return t._uf_m2;}).filter(function(x){return x>0;});
  var m2s = data.map(function(t){return t._m2;}).filter(function(x){return x>0;});

  var prom = ufm2.length ? round(mean(ufm2),1) : 0;
  var med = ufm2.length ? round(median(ufm2),1) : 0;
  var min = ufm2.length ? round(Math.min.apply(null,ufm2),1) : 0;
  var max = ufm2.length ? round(Math.max.apply(null,ufm2),1) : 0;
  var m2prom = m2s.length ? Math.round(mean(m2s)) : 0;

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">03</span><span class="dash-sec-title">Precios del mercado</span></div>'+
    '<div class="dash-sec-sub">Cómo se mueven los números en tu universo de análisis</div>'+
    '<div class="kpi-grid">'+
      kpiCard('UF/m² promedio', prom || '—', '', 'Media aritmética', 'accent') +
      kpiCard('UF/m² mediana', med || '—', '', 'Menos sensible a outliers', '') +
      kpiCard('Rango UF/m²', (min||'—')+' – '+(max||'—'), '', 'Mínimo / máximo', '') +
      kpiCard('Superficie promedio', fmtNum(m2prom), ' m²', 'Tamaño típico ofertado', '') +
    '</div>'+
  '</div>';
}

/* --- 04. GEO (comunas + donut) --- */
function renderGeoSection(data){
  // Top comunas por volumen
  var byComuna = groupBy(data,function(t){return g(t,'comuna')||'Sin comuna';});
  var comunas = Object.keys(byComuna).map(function(k){
    var list=byComuna[k];
    var precios=list.map(function(t){return t._uf_m2;}).filter(function(x){return x>0;});
    return {
      nombre:k, count:list.length,
      precioProm: precios.length?round(mean(precios),1):0
    };
  });
  var topVol = comunas.slice().sort(function(a,b){return b.count-a.count;}).slice(0,8);
  var maxVol = topVol.length ? topVol[0].count : 1;

  var topPrecio = comunas.filter(function(c){return c.precioProm>0;})
    .sort(function(a,b){return a.precioProm-b.precioProm;}).slice(0,8);
  var maxPrecio = topPrecio.length ? Math.max.apply(null,topPrecio.map(function(c){return c.precioProm;})) : 1;

  var volBars = topVol.map(function(c){
    var pct = Math.round(c.count/maxVol*100);
    return '<div class="bar-row"><div class="bar-label" title="'+c.nombre+'">'+c.nombre+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+c.count+'</div></div>';
  }).join('');

  var precioBars = topPrecio.map(function(c){
    var pct = Math.round(c.precioProm/maxPrecio*100);
    return '<div class="bar-row"><div class="bar-label" title="'+c.nombre+'">'+c.nombre+'</div>'+
      '<div class="bar-track"><div class="bar-fill green" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+c.precioProm+'</div></div>';
  }).join('');

  // Donut por resultado
  var byRes = {analizando:0,rechazado:0,positivo:0};
  data.forEach(function(t){ byRes[t._resultado] = (byRes[t._resultado]||0)+1; });
  var donutHtml = renderDonut(byRes, data.length);

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">04</span><span class="dash-sec-title">Distribución geográfica</span></div>'+
    '<div class="dash-sec-sub">Dónde está la oferta y cómo están los precios por zona</div>'+
    '<div class="dash-two-col">'+
      '<div class="dash-card">'+
        '<div class="dash-card-title">Top comunas por volumen</div>'+
        '<div class="dash-card-sub">Cantidad de terrenos</div>'+
        '<div class="bar-list">'+(volBars||'<div class="no-data">Sin datos</div>')+'</div>'+
      '</div>'+
      '<div class="dash-card">'+
        '<div class="dash-card-title">UF/m² promedio por comuna</div>'+
        '<div class="dash-card-sub">Ordenado de más barato a más caro</div>'+
        '<div class="bar-list">'+(precioBars||'<div class="no-data">Sin datos</div>')+'</div>'+
      '</div>'+
    '</div>'+
    '<div style="height:12px"></div>'+
    '<div class="dash-card">'+
      '<div class="dash-card-title">Distribución por resultado</div>'+
      '<div class="dash-card-sub">Proporción del filtro actual</div>'+
      donutHtml+
    '</div>'+
  '</div>';
}

/* Donut SVG simple */
function renderDonut(counts, total){
  if(!total) return '<div class="no-data">Sin datos</div>';
  var segments=[
    {key:'analizando', label:'Analizando', color:RESULT_COLOR.analizando, val:counts.analizando||0},
    {key:'rechazado', label:'Rechazado', color:RESULT_COLOR.rechazado, val:counts.rechazado||0},
    {key:'positivo', label:'Aprobado', color:RESULT_COLOR.positivo, val:counts.positivo||0}
  ].filter(function(s){return s.val>0;});

  var r=50, cx=60, cy=60, circ=2*Math.PI*r;
  var offset=0;
  var circles = segments.map(function(s){
    var pct = s.val/total;
    var len = pct*circ;
    var c = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="18" '+
      'stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
    return c;
  }).join('');

  var legend = segments.map(function(s){
    var pct = Math.round(s.val/total*100);
    return '<div class="donut-row">'+
      '<div class="donut-row-left"><span class="donut-dot" style="background:'+s.color+'"></span><span class="donut-name">'+s.label+'</span></div>'+
      '<span class="donut-val">'+s.val+' · '+pct+'%</span>'+
    '</div>';
  }).join('');

  return '<div class="donut-wrap">'+
    '<svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120">'+
      '<circle cx="60" cy="60" r="50" fill="none" stroke="#F0EBE4" stroke-width="18"/>'+
      circles+
      '<text x="60" y="58" text-anchor="middle" font-family="Fraunces,serif" font-size="22" font-weight="500" fill="#1A1814">'+total+'</text>'+
      '<text x="60" y="74" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#7A7468">TOTAL</text>'+
    '</svg>'+
    '<div class="donut-legend">'+legend+'</div>'+
  '</div>';
}

/* --- 05. LÍDERES POR COMUNA --- */
function renderLeadersSection(data){
  // Agrupar terrenos por comuna y encontrar el más barato (mínimo UF/m²) de cada una
  var byComuna = groupBy(data, function(t){return g(t,'comuna')||'Sin comuna';});

  var comunaLeaders = Object.keys(byComuna).map(function(comuna){
    var list = byComuna[comuna];
    // Solo considerar terrenos con UF/m² > 0
    var conPrecio = list.filter(function(t){return t._uf_m2>0;});
    if(!conPrecio.length) return null;

    var sorted = conPrecio.slice().sort(function(a,b){return a._uf_m2-b._uf_m2;});
    var lider = sorted[0];
    var precioProm = mean(conPrecio.map(function(t){return t._uf_m2;}));
    var ahorro = precioProm>0 ? Math.round((precioProm-lider._uf_m2)/precioProm*100) : 0;

    return {
      comuna: comuna,
      total: list.length,
      conPrecio: conPrecio.length,
      lider: lider,
      precioProm: precioProm,
      ahorro: ahorro
    };
  }).filter(function(x){return x!==null;});

  // Ordenar por cantidad de terrenos (más oferta = más relevante)
  comunaLeaders.sort(function(a,b){return b.total-a.total;});

  if(!comunaLeaders.length){
    return '<div class="dash-section">'+
      '<div class="dash-section-head"><span class="dash-sec-num">05</span><span class="dash-sec-title">Líderes por comuna</span></div>'+
      '<div class="dash-sec-sub">El terreno más barato de cada comuna en tu base</div>'+
      '<div class="dash-card"><div class="no-data">Sin terrenos con UF/m² registrado</div></div>'+
    '</div>';
  }

  var rows = comunaLeaders.map(function(cl){
    var l = cl.lider;
    var addr = g(l,'direccion') || 'Sin dirección';
    var ufm2 = Math.round(l._uf_m2*10)/10;
    var m2 = l._m2 ? Math.round(l._m2).toLocaleString('es-CL')+' m²' : '—';
    var uf = l._uf ? 'UF '+Math.round(l._uf).toLocaleString('es-CL') : '—';
    var ahorroBadge = cl.ahorro>0
      ? '<span class="score-pill score-hi" title="Más barato que el promedio de la comuna">−'+cl.ahorro+'% vs prom.</span>'
      : '<span class="score-pill score-mid">único con precio</span>';
    var coverage = cl.conPrecio<cl.total
      ? '<span style="font-size:10px;color:var(--text-faint);font-family:var(--font-mono)"> ('+cl.conPrecio+'/'+cl.total+' c/precio)</span>'
      : '';

    return '<tr style="cursor:pointer" onclick="closeDashboard(); selectTerrain('+l._id+')">'+
      '<td>'+
        '<div style="font-weight:500;font-size:13px">'+cl.comuna+'</div>'+
        '<div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">'+cl.total+' terreno'+(cl.total!==1?'s':'')+coverage+'</div>'+
      '</td>'+
      '<td>'+
        '<div style="font-family:var(--font-serif);font-size:13px;font-weight:500">'+addr+'</div>'+
        '<div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px">'+m2+' · '+uf+'</div>'+
      '</td>'+
      '<td class="num"><strong style="font-family:var(--font-serif);font-size:16px;color:var(--green)">'+ufm2+'</strong></td>'+
      '<td class="num">'+ahorroBadge+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">05</span><span class="dash-sec-title">Líderes por comuna</span></div>'+
    '<div class="dash-sec-sub">El terreno más barato de cada comuna · Click en una fila para abrir el detalle</div>'+
    '<div class="dash-card" style="padding:8px 16px">'+
      '<table class="corr-table">'+
        '<thead><tr>'+
          '<th>Comuna</th>'+
          '<th>Terreno más barato</th>'+
          '<th class="num">UF/m²</th>'+
          '<th class="num">Ahorro</th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
}

/* --- 06. RANKING DE CORREDORES --- */
function renderBrokersSection(data){
  // Solo terrenos con corredor definido
  var withBroker = data.filter(function(t){return t._corredor;});

  if(!withBroker.length){
    return '<div class="dash-section">'+
      '<div class="dash-section-head"><span class="dash-sec-num">06</span><span class="dash-sec-title">Ranking de corredores</span></div>'+
      '<div class="dash-sec-sub">Quién te entrega la mejor información</div>'+
      '<div class="dash-card">'+
        '<div class="corr-empty">'+
          '<div class="corr-empty-title">Agrega una columna <span class="corr-empty-code">Corredor</span> en tu Sheet</div>'+
          '<div class="corr-empty-text">Una vez que empieces a registrar el corredor en cada terreno, acá aparecerá el ranking automáticamente. El score combina <strong>'+Math.round(BROKER_WEIGHTS.volumen*100)+'% volumen</strong> + <strong>'+Math.round(BROKER_WEIGHTS.hitRate*100)+'% hit rate</strong> + <strong>'+Math.round(BROKER_WEIGHTS.calidad*100)+'% calidad de info</strong>.</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  // Agrupar por corredor
  var byBroker = groupBy(withBroker,function(t){return t._corredor;});
  var brokers = Object.keys(byBroker).map(function(name){
    var list=byBroker[name];
    var analizando = list.filter(function(t){return t._resultado==='analizando'||t._resultado==='positivo';}).length;
    // Calidad promedio: solo considera terrenos que tienen al menos un check marcado.
    // Los no clasificados se ignoran para no penalizar al corredor por tus datos viejos.
    var clasificados = list.filter(function(t){return t._infoTieneClasificacion;});
    var calidadProm = clasificados.length
      ? mean(clasificados.map(function(t){return t._infoScore;}))
      : null; // null = sin datos suficientes
    return {
      nombre: name,
      volumen: list.length,
      hitRate: list.length ? analizando/list.length : 0,
      calidadProm: calidadProm,
      clasificados: clasificados.length
    };
  });

  // Normalización del volumen
  var maxVol = Math.max.apply(null, brokers.map(function(b){return b.volumen;}));
  // Para calidad: si nadie tiene clasificación, el componente vale 0 para todos
  var hayCalidadData = brokers.some(function(b){return b.calidadProm!==null;});

  brokers.forEach(function(b){
    var nVol = maxVol ? b.volumen/maxVol : 0;
    var nHit = b.hitRate; // ya es 0-1
    // Calidad: si no tiene datos clasificados, usa 0.5 como valor neutro.
    // Así no penaliza pero tampoco premia. Aparecerá un ícono de advertencia.
    var nCalidad = b.calidadProm!==null ? b.calidadProm : 0.5;

    b.score = Math.round(100*(
      BROKER_WEIGHTS.volumen*nVol +
      BROKER_WEIGHTS.hitRate*nHit +
      BROKER_WEIGHTS.calidad*nCalidad
    ));
  });

  brokers.sort(function(a,b){return b.score-a.score;});

  var rows = brokers.map(function(b,i){
    var rankClass = i<3 ? 'corr-rank top' : 'corr-rank';
    var scoreClass = b.score>=70?'score-hi':(b.score>=40?'score-mid':'score-lo');
    var calidadCell;
    if(b.calidadProm===null){
      calidadCell = '<span class="info-warn" title="Sin terrenos con info clasificada">— <span style="font-size:10px">sin datos</span></span>';
    } else {
      var pct = Math.round(b.calidadProm*100);
      var dots = renderQualityDots(b.calidadProm);
      calidadCell = dots+' <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:4px">'+pct+'%</span>'+
        '<div style="font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px">'+b.clasificados+'/'+b.volumen+' clasif.</div>';
    }
    return '<tr>'+
      '<td><span class="'+rankClass+'">'+(i+1)+'</span><span class="corr-name">'+b.nombre+'</span></td>'+
      '<td class="num">'+b.volumen+'</td>'+
      '<td class="num">'+Math.round(b.hitRate*100)+'%</td>'+
      '<td>'+calidadCell+'</td>'+
      '<td class="num"><span class="score-pill '+scoreClass+'">'+b.score+'</span></td>'+
    '</tr>';
  }).join('');

  var infoNote = !hayCalidadData
    ? '<div style="background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:14px;border-left:3px solid var(--amber)">Aún no has clasificado la calidad de info en ninguno de tus terrenos. El score de calidad está en 50% neutro para todos. Empieza marcando los campos <strong>Fotos, KMZ, Plano, Cabida, Presentacion</strong> en tu Sheet.</div>'
    : '';

  return '<div class="dash-section">'+
    '<div class="dash-section-head"><span class="dash-sec-num">06</span><span class="dash-sec-title">Ranking de corredores</span></div>'+
    '<div class="dash-sec-sub">Score combina '+Math.round(BROKER_WEIGHTS.volumen*100)+'% volumen + '+Math.round(BROKER_WEIGHTS.hitRate*100)+'% hit rate + '+Math.round(BROKER_WEIGHTS.calidad*100)+'% calidad de info</div>'+
    infoNote+
    '<div class="dash-card" style="padding:16px 20px">'+
      '<table class="corr-table">'+
        '<thead><tr>'+
          '<th>Corredor</th>'+
          '<th class="num">Volumen</th>'+
          '<th class="num">Hit rate</th>'+
          '<th>Calidad de info</th>'+
          '<th class="num">Score</th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
}

// Dibuja puntos llenos/vacíos representando el score de calidad (0-1)
function renderQualityDots(score){
  var filled = Math.round(score*5);
  var dots='';
  for(var i=0;i<5;i++){
    var color = i<filled ? 'var(--accent)' : 'var(--border)';
    dots+='<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+color+';margin-right:2px"></span>';
  }
  return '<span style="white-space:nowrap">'+dots+'</span>';
}

function drawEvolutionChart(data){
  var canvas = document.getElementById('evo-canvas');
  if(!canvas) return;

  // Agrupar por mes (YYYY-MM)
  var withDate = data.filter(function(t){return t._fecha;});
  if(!withDate.length){
    var ctx0=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth*2; canvas.height=canvas.offsetHeight*2;
    ctx0.scale(2,2);
    ctx0.fillStyle='#ADA89F'; ctx0.font='12px "DM Mono"'; ctx0.textAlign='center';
    ctx0.fillText('Sin datos con fecha para mostrar', canvas.offsetWidth/2, canvas.offsetHeight/2);
    return;
  }

  var byMonth = {};
  withDate.forEach(function(t){
    var k = t._fecha.getFullYear()+'-'+(t._fecha.getMonth()+1).toString().padStart(2,'0');
    if(!byMonth[k]) byMonth[k]={analizando:0,rechazado:0,positivo:0,precios:[]};
    byMonth[k][t._resultado]++;
    if(t._uf_m2>0) byMonth[k].precios.push(t._uf_m2);
  });

  var months = Object.keys(byMonth).sort();
  var series = months.map(function(m){
    var d=byMonth[m];
    return {
      mes:m,
      analizando:d.analizando,
      rechazado:d.rechazado,
      positivo:d.positivo,
      total:d.analizando+d.rechazado+d.positivo,
      precioProm: d.precios.length?mean(d.precios):null
    };
  });

  // Setup canvas HiDPI
  var w = canvas.offsetWidth;
  var h = canvas.offsetHeight;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = w*dpr; canvas.height = h*dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  var pad = {l:40,r:50,t:20,b:36};
  var chartW = w - pad.l - pad.r;
  var chartH = h - pad.t - pad.b;
  var n = series.length;
  var barSlot = chartW / Math.max(n,1);
  var barW = Math.min(barSlot*0.6, 40);

  var maxTotal = Math.max.apply(null, series.map(function(s){return s.total;})) || 1;
  var preciosValidos = series.map(function(s){return s.precioProm;}).filter(function(x){return x!==null;});
  var minPrecio = preciosValidos.length ? Math.min.apply(null,preciosValidos) : 0;
  var maxPrecio = preciosValidos.length ? Math.max.apply(null,preciosValidos) : 1;

  // Ejes
  ctx.strokeStyle='#E2DDD6'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, pad.t+chartH);
  ctx.lineTo(pad.l+chartW, pad.t+chartH);
  ctx.stroke();

  // Gridlines horizontales
  ctx.fillStyle='#ADA89F'; ctx.font='10px "DM Mono"'; ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y = pad.t + chartH - (i/4)*chartH;
    var val = Math.round((i/4)*maxTotal);
    ctx.fillText(val, pad.l-6, y+3);
    if(i>0){
      ctx.strokeStyle='#F0EBE4';
      ctx.beginPath();
      ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+chartW, y);
      ctx.stroke();
    }
  }

  // Barras apiladas
  series.forEach(function(s,i){
    var x = pad.l + barSlot*i + (barSlot-barW)/2;
    var yBase = pad.t+chartH;
    var order = ['rechazado','analizando','positivo'];
    order.forEach(function(k){
      var v = s[k]; if(!v) return;
      var hBar = (v/maxTotal)*chartH;
      ctx.fillStyle = RESULT_COLOR[k];
      ctx.fillRect(x, yBase-hBar, barW, hBar);
      yBase -= hBar;
    });

    // Label mes
    ctx.fillStyle='#7A7468'; ctx.font='10px "DM Mono"'; ctx.textAlign='center';
    var parts = s.mes.split('-');
    var mesNombre = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(parts[1])-1];
    ctx.fillText(mesNombre+' '+parts[0].slice(2), x+barW/2, pad.t+chartH+16);
  });

  // Línea UF/m² promedio (eje secundario)
  if(preciosValidos.length>1 && maxPrecio>minPrecio){
    ctx.strokeStyle='#2D5BE3'; ctx.lineWidth=2;
    ctx.beginPath();
    var firstPoint=true;
    series.forEach(function(s,i){
      if(s.precioProm===null) return;
      var x = pad.l + barSlot*i + barSlot/2;
      var y = pad.t + chartH - ((s.precioProm-minPrecio)/(maxPrecio-minPrecio))*chartH;
      if(firstPoint){ ctx.moveTo(x,y); firstPoint=false; }
      else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // Puntos
    ctx.fillStyle='#2D5BE3';
    series.forEach(function(s,i){
      if(s.precioProm===null) return;
      var x = pad.l + barSlot*i + barSlot/2;
      var y = pad.t + chartH - ((s.precioProm-minPrecio)/(maxPrecio-minPrecio))*chartH;
      ctx.beginPath();
      ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fill();
    });

    // Eje secundario derecho (UF/m²)
    ctx.fillStyle='#2D5BE3'; ctx.font='10px "DM Mono"'; ctx.textAlign='left';
    ctx.fillText(round(maxPrecio,1), pad.l+chartW+6, pad.t+6);
    ctx.fillText(round(minPrecio,1), pad.l+chartW+6, pad.t+chartH);
  }
}

// Cambia el filtro activo (chip de arriba) y re-renderiza el dashboard
function setDashboardFilter(filterValue){
  // Si ya está activo, lo quita (vuelve a "todos")
  var newFilter = (activeFilter === filterValue) ? 'todos' : filterValue;
  activeFilter = newFilter;

  var chips = document.querySelectorAll('#float-filters .chip');
  chips.forEach(function(c){
    c.classList.remove('active-todos','active-analizando','active-rechazado','active-positivo');

  var chipMap = {
    'todos':'active-todos',
    'analizando':'active-analizando',
    'rechazado':'active-rechazado',
    'positivo':'active-positivo'
  };
  // Encontrar el chip correspondiente y marcarlo
  chips.forEach(function(c){
    var txt = c.textContent.trim().toLowerCase();
    if((newFilter==='todos' && txt==='todos') ||
       (newFilter==='analizando' && txt==='analizando') ||

       (newFilter==='rechazado' && txt==='rechazado')){

/* ============================================================
   EQUIPAMIENTO DEL ENTORNO (POIs vía Overpass)
   ============================================================ */

// Distancia en metros entre dos puntos lat/lng (fórmula de Haversine)
function distanceMeters(lat1, lng1, lat2, lng2){
  var R = 6371000; // radio de la Tierra en metros
  var toRad = function(d){return d*Math.PI/180;};
  var dLat = toRad(lat2-lat1);
  var dLng = toRad(lng2-lng1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(toRad(lat1))*Math.cos(toRad(lat2)) *
          Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}

// Construye la query Overpass-QL para un terreno y todas las categorías
function buildOverpassQuery(lat, lng, radius){
  var allQueries = [];
  POI_CATEGORIES.forEach(function(cat){
    cat.queries.forEach(function(q){
      // Cada query tiene formato: node["amenity"="school"](around:RADIO,LAT,LNG);
      allQueries.push(q+'(around:'+radius+','+lat+','+lng+');');
    });
  });
  return '[out:json][timeout:25];('+allQueries.join('')+');out center;';
}

// Determina a qué categoría pertenece un elemento de OSM según sus tags
function categorizePOI(tags){
  if(!tags) return null;
  if(tags.amenity==='school' || tags.amenity==='university') return 'educacion';
  if(tags.shop==='supermarket' || tags.amenity==='pharmacy' || tags.shop==='mall' || tags.amenity==='marketplace') return 'comercio';
  if(tags.leisure==='park' || tags.leisure==='garden' || tags.landuse==='recreation_ground') return 'areas_verdes';
  if(tags.station==='subway' || tags.railway==='subway_entrance') return 'transporte';
  if(tags.amenity==='hospital' || tags.amenity==='clinic' || tags.healthcare==='centre') return 'salud';
  return null;
}

// Consulta Overpass y devuelve POIs agrupados por categoría
function fetchPOIs(terreno, callback){
  if(!terreno._lat || !terreno._lng){
    callback(null, 'Sin coordenadas');
    return;
  }

  // Usar cache si existe
  var cacheKey = terreno._id+'_'+POI_RADIUS;
  if(poiCache[cacheKey]){
    callback(poiCache[cacheKey], null);
    return;
  }

  var query = buildOverpassQuery(terreno._lat, terreno._lng, POI_RADIUS);
  var url = 'https://overpass-api.de/api/interpreter';

  fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: 'data='+encodeURIComponent(query)
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var byCategory = { educacion:[], comercio:[], areas_verdes:[], transporte:[], salud:[] };
    if(data.elements){
      data.elements.forEach(function(el){
        var cat = categorizePOI(el.tags);
        if(!cat) return;
        // Para 'way' (polígonos), Overpass devuelve el centro en el campo 'center'
        var lat = el.lat || (el.center && el.center.lat);
        var lng = el.lon || (el.center && el.center.lon);
        if(!lat || !lng) return;
        var dist = Math.round(distanceMeters(terreno._lat, terreno._lng, lat, lng));
        if(dist > POI_RADIUS) return; // descartar si supera el radio
        var name = (el.tags && el.tags.name) || '(sin nombre)';
        // Evitar duplicados por nombre + cercanía
        var dup = byCategory[cat].some(function(p){
          return p.name===name && Math.abs(p.distance-dist)<50;
        });
        if(dup) return;
        byCategory[cat].push({ name:name, lat:lat, lng:lng, distance:dist, tags:el.tags });
      });
      // Ordenar cada categoría por distancia
      Object.keys(byCategory).forEach(function(k){
        byCategory[k].sort(function(a,b){return a.distance-b.distance;});
      });

      // Agrupar estaciones de metro: entradas a < 150m entre sí son la misma estación.
      // Después de agrupar, quedarse solo con las 2 estaciones más cercanas.
      byCategory.transporte = agruparEstacionesMetro(byCategory.transporte);
    }
    poiCache[cacheKey] = byCategory;
    callback(byCategory, null);
  })
  .catch(function(err){
    console.error('Overpass error:', err);
    callback(null, 'Error al consultar Overpass');
  });
}

// Agrupa entradas de metro cercanas en estaciones únicas.
// La lista de entrada ya viene ordenada por distancia al terreno.
function agruparEstacionesMetro(entradas){
  var UMBRAL_MISMA_ESTACION = 150; // metros entre entradas de la misma estación
  var MAX_ESTACIONES = 2; // cuántas estaciones mostrar

  var estaciones = [];

  entradas.forEach(function(entrada){
    // ¿Esta entrada pertenece a una estación ya detectada?
    var perteneceA = null;
    for(var i=0;i<estaciones.length;i++){
      var est = estaciones[i];
      var d = distanceMeters(entrada.lat, entrada.lng, est.lat, est.lng);
      if(d < UMBRAL_MISMA_ESTACION){
        perteneceA = est;
        break;
      }
    }

    if(perteneceA){
      // Ya existe la estación. Si esta entrada tiene mejor nombre, lo usamos.
      // (a veces la estación tiene nombre y las entradas no, o viceversa)
      if(perteneceA.name === '(sin nombre)' && entrada.name !== '(sin nombre)'){
        perteneceA.name = entrada.name;
      }
      // La entrada más cercana define la posición y distancia de la estación
      // (como la lista viene ordenada, la primera ya es la más cercana, no hacemos nada)
    } else {
      // Estación nueva
      estaciones.push({
        name: entrada.name,
        lat: entrada.lat,
        lng: entrada.lng,
        distance: entrada.distance,
        tags: entrada.tags
      });
    }
  });

  // Quedarse con las MAX_ESTACIONES más cercanas (ya están ordenadas)
  var resultado = estaciones.slice(0, MAX_ESTACIONES);

  // Si alguna estación quedó sin nombre, ponerle un nombre genérico
  resultado.forEach(function(est){
    if(est.name === '(sin nombre)' || !est.name){
      est.name = 'Estación de Metro';
    }
  });

  return resultado;
}

/* ============================================================
   MERCADO DEL SECTOR
   Encuentra proyectos de mercado dentro de un radio del terreno
   y calcula promedios simples de las variables clave.
   ============================================================ */
var MERCADO_RADIUS = 800; // metros
var mercadoMarkers = []; // markers de los proyectos en el mapa
var mercadoOpenForId = null; // id del terreno con panel abierto

function getMercadoSector(terreno){
  if(!terreno._lat || !terreno._lng) return null;
  if(!allMercado.length) return { sinData:true };

  var cercanos = [];
  allMercado.forEach(function(p){
    if(!p.lat || !p.lng) return;
    // Filtrar por tipo: solo proyectos del mismo tipo que el terreno.
    // Si el terreno no tiene tipo definido, mostrar todos (mezclado).
    if(terreno._tipo && p.tipo && terreno._tipo !== p.tipo) return;
    var dist = Math.round(distanceMeters(terreno._lat, terreno._lng, p.lat, p.lng));
    if(dist <= MERCADO_RADIUS){
      cercanos.push({
        nombre: p.nombre,
        direccion: p.direccion,
        desarrollador: p.desarrollador,
        tipo: p.tipo,
        lat: p.lat,
        lng: p.lng,
        distance: dist,
        uf_m2: p.uf_m2,
        ticket: p.ticket,
        umes: p.umes,
        superficie: p.superficie
      });
    }
  });

  if(!cercanos.length) return { sinCercanos:true, tipoTerreno: terreno._tipo };
  cercanos.sort(function(a,b){return a.distance-b.distance;});

  function promedioDe(getter){
    var vals = cercanos.map(getter).filter(function(v){return v>0;});
    if(!vals.length) return null;
    return vals.reduce(function(a,b){return a+b;},0)/vals.length;
  }

  return {
    proyectos: cercanos,
    count: cercanos.length,
    promUFm2: promedioDe(function(p){return p.uf_m2;}),
    promTicket: promedioDe(function(p){return p.ticket;}),
    promUmes: promedioDe(function(p){return p.umes;}),
    promSuperficie: promedioDe(function(p){return p.superficie;})
  };
}

// Genera el HTML interno del panel flotante de mercado
function renderMercadoPanelContent(terreno){
  var data = getMercadoSector(terreno);

  if(!terreno._lat || !terreno._lng){
    return '<div class="no-data" style="padding:14px">Sin coordenadas para analizar el mercado</div>';
  }
  if(data && data.sinData){
    return '<div class="no-data" style="padding:14px">Aún no hay data de mercado cargada. Agrega proyectos en la pestaña Mercado del Sheet.</div>';
  }
  if(data && data.sinCercanos){
    var msgTipo = '';
    if(data.tipoTerreno==='departamento') msgTipo = ' de departamentos';
    else if(data.tipoTerreno==='casa') msgTipo = ' de casas';
    return '<div class="no-data" style="padding:14px">No hay proyectos'+msgTipo+' a menos de '+MERCADO_RADIUS+' m de este terreno.</div>';
  }

  function fmtNum(n, dec){
    if(n===null||n===undefined) return '—';
    return n.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  }

  // Tarjetas con los 4 promedios
  var kpis =
    '<div class="merc-kpi-grid">'+
      '<div class="merc-kpi">'+
        '<div class="merc-kpi-label">UF/m² promedio</div>'+
        '<div class="merc-kpi-val">'+fmtNum(data.promUFm2,1)+'</div>'+
      '</div>'+
      '<div class="merc-kpi">'+
        '<div class="merc-kpi-label">Ticket promedio</div>'+
        '<div class="merc-kpi-val">UF '+fmtNum(data.promTicket,0)+'</div>'+
      '</div>'+
      '<div class="merc-kpi">'+
        '<div class="merc-kpi-label">Velocidad de venta</div>'+
        '<div class="merc-kpi-val">'+fmtNum(data.promUmes,1)+' <span class="merc-kpi-unit">u/mes</span></div>'+
      '</div>'+
      '<div class="merc-kpi">'+
        '<div class="merc-kpi-label">Superficie prom.</div>'+
        '<div class="merc-kpi-val">'+fmtNum(data.promSuperficie,1)+' <span class="merc-kpi-unit">m²</span></div>'+
      '</div>'+
    '</div>';

  // Lista de proyectos considerados
  var lista = '<div class="merc-list">'+
    data.proyectos.map(function(p){
      var sub = [];
      if(p.desarrollador) sub.push(p.desarrollador);
      if(p.uf_m2>0) sub.push(fmtNum(p.uf_m2,1)+' UF/m²');
      return '<div class="merc-item">'+
        '<div class="merc-item-main">'+
          '<div class="merc-item-name">'+(p.nombre||'(sin nombre)')+'</div>'+
          '<div class="merc-item-sub">'+sub.join(' · ')+'</div>'+
        '</div>'+
        '<div class="merc-item-dist">'+p.distance+' m</div>'+
      '</div>';
    }).join('')+
  '</div>';

  return kpis +
    '<div class="merc-section-label">Proyectos considerados ('+data.count+')</div>'+
    lista +
    '<div class="merc-foot">Radio: '+MERCADO_RADIUS+' m · Promedios simples</div>';
}

// Abre el panel flotante de mercado para el terreno indicado
function openMercadoPanel(terrenoId){
  var t = allTerrains.find(function(x){return x._id==terrenoId;});
  if(!t) return;

  mercadoOpenForId = terrenoId;
  var panel = document.getElementById('mercado-panel');
  var content = document.getElementById('mercado-content');
  if(!panel || !content) return;

  // Título del panel: agregar tipo si el terreno lo tiene
  var titleEl = document.getElementById('mercado-title-text');
  if(titleEl){
    var titulo = 'Mercado del sector';
    if(t._tipo==='departamento') titulo += ' · Departamentos';
    else if(t._tipo==='casa') titulo += ' · Casas';
    titleEl.textContent = titulo;
  }

  content.innerHTML = renderMercadoPanelContent(t);
  panel.style.display = 'flex';

  // Pintar los proyectos de mercado en el mapa
  drawMercadoMarkers(t);
}

function closeMercadoPanel(){
  mercadoOpenForId = null;
  var panel = document.getElementById('mercado-panel');
  if(panel) panel.style.display = 'none';
  clearMercadoMarkers();
  updateMercadoTriggerBtn();
}

// Toggle desde el botón en el detalle del terreno
function toggleMercadoPanel(terrenoId){
  if(mercadoOpenForId === terrenoId){
    closeMercadoPanel();
  } else {
    openMercadoPanel(terrenoId);
    updateMercadoTriggerBtn();
  }
}

// Actualiza estado visual del botón (activo/normal y su texto)
function updateMercadoTriggerBtn(){
  var btn = document.getElementById('mercado-trigger-btn');
  if(!btn) return;
  var t = allTerrains.find(function(x){return x._id==selectedId;});
  if(!t) return;
  var isOpen = mercadoOpenForId == t._id;
  btn.classList.toggle('active', isOpen);
  btn.querySelector('.mt-left span:last-child').textContent =
    isOpen ? 'Ocultar mercado del sector' : 'Ver mercado del sector';
}

function clearMercadoMarkers(){
  mercadoMarkers.forEach(function(m){ map.removeLayer(m); });
  mercadoMarkers = [];
}

function drawMercadoMarkers(terreno){
  clearMercadoMarkers();
  var data = getMercadoSector(terreno);
  if(!data || !data.proyectos) return;

  var sz = captureMode ? 30 : 22;
  var fontSz = captureMode ? 14 : 11;
  var border = captureMode ? 3 : 2;

  data.proyectos.forEach(function(p){
    var icon = L.divIcon({
      html:'<div style="background:#C0392B;color:white;width:'+sz+'px;height:'+sz+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:'+fontSz+'px;font-weight:600;border:'+border+'px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">M</div>',
      className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
    });
    var marker = L.marker([p.lat,p.lng],{icon:icon}).addTo(map);

    var tooltipText = p.nombre + ' · ' + p.distance + ' m';
    if(captureMode){
      marker.bindTooltip(p.nombre, {direction:'top', offset:[0,-sz/2-2], permanent:true, className:'poi-label-permanent'});
    } else {
      marker.bindTooltip(tooltipText, {direction:'top', offset:[0,-8]});
    }
    mercadoMarkers.push(marker);
  });
}

            '<span style="display:flex;align-items:center;gap:6px;flex:1;min-width:0">'+
              '<span class="poi-dot" style="color:'+dotColor+';font-size:13px;line-height:1">'+dotChar+'</span>'+
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.name+'</span>'+
            '</span>'+
            '<span style="font-family:var(--font-mono);font-size:10px;margin-left:8px;color:var(--text-faint);flex-shrink:0">'+p.distance+' m</span>'+
          '</div>';
        }).join('')+
      '</div>';
    }

    var clickHandler = list.length
      ? 'onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\';this.querySelector(\'.poi-arrow\').style.transform=this.nextElementSibling.style.display===\'none\'?\'\':\'rotate(90deg)\'"'
      : '';
    var cursor = list.length ? 'cursor:pointer' : 'cursor:default';

    html += '<div data-cat="'+cat.key+'">'+
      '<div '+clickHandler+' style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:'+cat.bgColor+';border-radius:var(--radius);'+cursor+';transition:background 0.1s">'+
        '<span style="font-size:18px">'+cat.icon+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:500;color:'+cat.color+'">'+cat.label+'</div>'+
          '<div>'+nearestText+'</div>'+
        '</div>'+
        '<div style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:'+cat.color+';min-width:32px;text-align:right">'+count+'</div>'+
        (list.length?'<span class="poi-arrow" style="color:'+cat.color+';font-size:10px;transition:transform 0.15s">▶</span>':'')+
      '</div>'+
      detailsList+
    '</div>';
  });
  html += '</div>';
  html += '<div style="font-size:10px;font-family:var(--font-mono);color:var(--text-faint);margin-top:10px;text-align:right">Radio: '+POI_RADIUS+' m · ● visible en mapa · click para mostrar/ocultar</div>';

  el.innerHTML = html;
}

/* ============================================================
   CAPAS DE EQUIPAMIENTO EN EL MAPA

var poiMarkers = { educacion:[], comercio:[], areas_verdes:[], transporte:[], salud:[] };

function clearPOIMarkersOfCategory(catKey){

// Genera la clave única de un POI
function poiKey(catKey, p){
  return catKey+'|'+p.name+'|'+p.lat+'|'+p.lng;
}

// Inicializa la selección de POIs visibles con los N más cercanos de cada categoría.
// Se llama cuando se cargan los POIs de un terreno nuevo.
function initPoiSelection(byCategory){
  poiManualSet = {};
  POI_CATEGORIES.forEach(function(cat){
    var todos = byCategory[cat.key] || [];
    var maxN = POI_MAX_DIBUJADOS[cat.key] || 5;
    todos.slice(0, maxN).forEach(function(p){
      poiManualSet[poiKey(cat.key, p)] = true;
    });
  });
}

// Devuelve los POIs a dibujar para una categoría: simplemente los que están
// marcados como visibles en poiManualSet (es el estado completo).
function getPOIsToDraw(byCategory, catKey){
  var todos = byCategory[catKey] || [];
  return todos.filter(function(p){
    return poiManualSet[poiKey(catKey, p)];
  });
}

// Toggle de un POI de la lista: cualquier POI (del top o no) se puede
// agregar o quitar libremente del mapa.
function togglePoiManual(catKey, idx){
  if(!poiByCategoryCache) return;
  var list = poiByCategoryCache[catKey] || [];
  var p = list[idx];
  if(!p) return;
  var k = poiKey(catKey, p);

  var ahoraVisible;
  if(poiManualSet[k]){
    delete poiManualSet[k];
    ahoraVisible = false;
  } else {
    poiManualSet[k] = true;
    ahoraVisible = true;
    // Si la capa de esta categoría está apagada, prenderla automáticamente
    if(!poiVisible[catKey]){
      poiVisible[catKey] = true;
      var btnCat = document.getElementById('poi-btn-'+catKey);
      if(btnCat) btnCat.classList.add('active');
    }
  }

  // Re-dibujar solo la capa afectada
  clearPOIMarkersOfCategory(catKey);
  if(poiVisible[catKey]){
    drawPOIMarkers(poiByCategoryCache, catKey);
  }

  // Actualizar SOLO el item clickeado (sin re-renderizar toda la lista,
  // así no se cierran las categorías abiertas)
  updatePoiListItem(catKey, idx, ahoraVisible);
}

// Actualiza visualmente un solo item de la lista (el dot ● / ○)
function updatePoiListItem(catKey, idx, visible){
  var cat = POI_CATEGORIES.find(function(c){return c.key===catKey;});
  if(!cat) return;
  var catBlock = document.querySelector('[data-cat="'+catKey+'"]');
  if(!catBlock) return;
  var items = catBlock.querySelectorAll('.poi-list-item');
  var item = items[idx];
  if(!item) return;
  var dot = item.querySelector('.poi-dot');
  if(dot){
    dot.textContent = visible ? '●' : '○';
    dot.style.color = visible ? cat.color : 'var(--text-faint)';
  }
}

function drawPOIMarkers(byCategory, catKey){
  var cat = POI_CATEGORIES.find(function(c){return c.key===catKey;});
  if(!cat) return;
  var list = getPOIsToDraw(byCategory, catKey);
  // En modo captura, los íconos son más grandes
  var sz = captureMode ? 32 : 22;
  var fontSz = captureMode ? 16 : 11;
  var border = captureMode ? 3 : 2;
  list.forEach(function(p){
    var icon = L.divIcon({
      html: '<div style="background:'+cat.color+';color:white;width:'+sz+'px;height:'+sz+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:'+fontSz+'px;border:'+border+'px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">'+cat.icon+'</div>',
      className: '',
      iconSize: [sz,sz],
      iconAnchor: [sz/2, sz/2]
    });
    var marker = L.marker([p.lat, p.lng], {icon:icon}).addTo(map);

    if(captureMode){
      // Etiqueta permanente arriba del ícono
      marker.bindTooltip(p.name, {
        direction: 'top',
        offset: [0, -sz/2 - 2],
        permanent: true,
        className: 'poi-label-permanent'
      });
    } else {
      // Tooltip al hover como antes
      marker.bindTooltip(p.name+' · '+p.distance+' m', {direction:'top', offset:[0,-8]});
    }
    poiMarkers[catKey].push(marker);
  });
}

function togglePOICategory(catKey){
  poiVisible[catKey] = !poiVisible[catKey];
  // Actualizar UI del botón
  var btn = document.getElementById('poi-btn-'+catKey);
  if(btn) btn.classList.toggle('active', poiVisible[catKey]);

  if(poiVisible[catKey]){
    // Necesitamos los POIs del terreno seleccionado
    if(!selectedId){
      poiVisible[catKey] = false;
      if(btn) btn.classList.remove('active');
      return;
    }
    var t = allTerrains.find(function(x){return x._id==selectedId;});
    if(!t) return;
    fetchPOIs(t, function(byCat, err){
      if(err) return;
      // Si no hay nada seleccionado en esta categoría todavía, inicializar con el top N
      var hayAlgo = (byCat[catKey]||[]).some(function(p){
        return poiManualSet[poiKey(catKey,p)];
      });
      if(!hayAlgo){
        var maxN = POI_MAX_DIBUJADOS[catKey] || 5;
        (byCat[catKey]||[]).slice(0, maxN).forEach(function(p){
          poiManualSet[poiKey(catKey,p)] = true;
        });
        // Refrescar la lista para reflejar los dots
        if(poiByCategoryCache) renderPOIs(poiByCategoryCache, null);
      }
      drawPOIMarkers(byCat, catKey);
    });
  } else {
    clearPOIMarkersOfCategory(catKey);
  }
}

// Renderizar el panel flotante de capas POI (aparece cuando hay terreno seleccionado)
function updatePOIControls(){
  var panel = document.getElementById('poi-controls');
  if(!panel) return;
  if(selectedId){
    panel.style.display = 'flex';
    // Reflejar el estado guardado de "abierto/cerrado" en la UI
    var cats = document.getElementById('poi-cats');
    var btn = document.getElementById('poi-toggle-btn');
    if(cats && btn){
      cats.style.display = poiPanelOpen ? 'flex' : 'none';
      btn.classList.toggle('open', poiPanelOpen);
    }
  } else {
    panel.style.display = 'none';
    // Apagar todas las capas si no hay terreno seleccionado
    Object.keys(poiVisible).forEach(function(k){
      if(poiVisible[k]){
        poiVisible[k] = false;
        var btn = document.getElementById('poi-btn-'+k);
        if(btn) btn.classList.remove('active');
      }
    });
    clearAllPOIMarkers();
  }
}

// Toggle del panel de equipamiento: abrir/cerrar las categorías
function togglePOIPanel(){
  poiPanelOpen = !poiPanelOpen;
  var cats = document.getElementById('poi-cats');
  var btn = document.getElementById('poi-toggle-btn');
  if(cats) cats.style.display = poiPanelOpen ? 'flex' : 'none';
  if(btn) btn.classList.toggle('open', poiPanelOpen);
}

/* ============================================================
   MODO CAPTURA
   Agranda puntos y muestra etiquetas permanentes para tomar pantallazos.
   ============================================================ */
var captureMode = false;

function toggleCaptureMode(){
  captureMode = !captureMode;
  var btn = document.getElementById('capture-toggle');
  var label = document.getElementById('capture-label');
  if(captureMode){
    btn.classList.add('active');
    label.textContent = 'Salir captura';
    document.body.classList.add('capture-mode');
  } else {
    btn.classList.remove('active');
    label.textContent = 'Captura';
    document.body.classList.remove('capture-mode');
  }

  // Redibujar los puntos de terrenos con tamaños nuevos
  renderMarkers();

  // Redibujar las capas POI activas con tamaños nuevos + etiquetas
  if(selectedId){
    var t = allTerrains.find(function(x){return x._id==selectedId;});
    if(t){
      Object.keys(poiVisible).forEach(function(catKey){
        if(poiVisible[catKey]){
          // Limpiar markers viejos
          clearPOIMarkersOfCategory(catKey);
          // Volver a dibujar con el modo nuevo
          fetchPOIs(t, function(byCat, err){
            if(err) return;
            drawPOIMarkers(byCat, catKey);
          });
        }
      });
    }
  }
}

/* ============================================================
   PANEL DESLIZABLE: lengueta, abrir, cerrar, pinear
   ============================================================ */
var sidebarPinned = false;

function openSidebar(){
  var sb = document.getElementById('sidebar');
  var tab = document.getElementById('panel-tab');
  sb.classList.add('open');
  tab.classList.add('hidden');
  shiftMapControls(true);
}

function closeSidebar(){
  // Si está pineado, despinear primero
  if(sidebarPinned){
    sidebarPinned = false;
    document.getElementById('sidebar').classList.remove('pinned');
    document.getElementById('pin-btn').classList.remove('active');
  }
  var sb = document.getElementById('sidebar');
  var tab = document.getElementById('panel-tab');
  sb.classList.remove('open');
  tab.classList.remove('hidden');
  shiftMapControls(false);
  // Forzar recálculo del mapa
  setTimeout(function(){ if(map) map.invalidateSize(); }, 320);
}

function togglePin(){
  sidebarPinned = !sidebarPinned;
  var sb = document.getElementById('sidebar');
  var pinBtn = document.getElementById('pin-btn');
  if(sidebarPinned){
    sb.classList.add('pinned');
    pinBtn.classList.add('active');
  } else {
    sb.classList.remove('pinned');
    pinBtn.classList.remove('active');
  }
  // Forzar recálculo del mapa por si cambió el área visible
  setTimeout(function(){ if(map) map.invalidateSize(); }, 100);
}

function shiftMapControls(open){
  var mc = document.getElementById('map-controls');
  if(!mc) return;
  if(open) mc.classList.add('shifted');
  else mc.classList.remove('shifted');
}

/* ============================================================
   POPOVER DE FECHAS
   ============================================================ */
function toggleDatePopover(){
  var pop = document.getElementById('date-popover');
  pop.classList.toggle('open');
}

// Cerrar popover si clickea afuera
document.addEventListener('click', function(e){
  var pop = document.getElementById('date-popover');
  var btn = document.getElementById('date-btn');
  if(!pop || !btn) return;
  if(pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)){
    pop.classList.remove('open');
  }
});
</script>
