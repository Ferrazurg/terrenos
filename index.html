function drawEvolutionChart(data){
  var canvas = document.getElementById('evo-canvas');
  if(!canvas) return;

  // Agrupar por mes (YYYY-MM)
  var withDate = data.filter(function(t){return t._fecha;});
  if(!withDate.length){
    var ctx0=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth*2; canvas.height=canvas.offsetHeight*2;
    ctx0.scale(2,2);
    ctx0.fillStyle='#ADA89F'; ctx0.font='12px "DM Mono"'; ctx0.textAlign='center';
    ctx0.fillText('Sin datos con fecha para mostrar', canvas.offsetWidth/2, canvas.offsetHeight/2);
    return;
  }

  var byMonth = {};
  withDate.forEach(function(t){
    var k = t._fecha.getFullYear()+'-'+(t._fecha.getMonth()+1).toString().padStart(2,'0');
    if(!byMonth[k]) byMonth[k]={analizando:0,rechazado:0,positivo:0,precios:[]};
    byMonth[k][t._resultado]++;
    if(t._uf_m2>0) byMonth[k].precios.push(t._uf_m2);
  });

  var months = Object.keys(byMonth).sort();
  var series = months.map(function(m){
    var d=byMonth[m];
    return {
      mes:m,
      analizando:d.analizando,
      rechazado:d.rechazado,
      positivo:d.positivo,
      total:d.analizando+d.rechazado+d.positivo,
      precioProm: d.precios.length?mean(d.precios):null
    };
  });

  // Setup canvas HiDPI
  var w = canvas.offsetWidth;
  var h = canvas.offsetHeight;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = w*dpr; canvas.height = h*dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  var pad = {l:40,r:50,t:20,b:36};
  var chartW = w - pad.l - pad.r;
  var chartH = h - pad.t - pad.b;
  var n = series.length;
  var barSlot = chartW / Math.max(n,1);
  var barW = Math.min(barSlot*0.6, 40);

  var maxTotal = Math.max.apply(null, series.map(function(s){return s.total;})) || 1;
  var preciosValidos = series.map(function(s){return s.precioProm;}).filter(function(x){return x!==null;});
  var minPrecio = preciosValidos.length ? Math.min.apply(null,preciosValidos) : 0;
  var maxPrecio = preciosValidos.length ? Math.max.apply(null,preciosValidos) : 1;

  // Ejes
  ctx.strokeStyle='#E2DDD6'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, pad.t+chartH);
  ctx.lineTo(pad.l+chartW, pad.t+chartH);
  ctx.stroke();

  // Gridlines horizontales
  ctx.fillStyle='#ADA89F'; ctx.font='10px "DM Mono"'; ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y = pad.t + chartH - (i/4)*chartH;
    var val = Math.round((i/4)*maxTotal);
    ctx.fillText(val, pad.l-6, y+3);
    if(i>0){
      ctx.strokeStyle='#F0EBE4';
      ctx.beginPath();
      ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+chartW, y);
      ctx.stroke();
    }
  }

  // Barras apiladas
  series.forEach(function(s,i){
    var x = pad.l + barSlot*i + (barSlot-barW)/2;
    var yBase = pad.t+chartH;
    var order = ['rechazado','analizando','positivo'];
    order.forEach(function(k){
      var v = s[k]; if(!v) return;
      var hBar = (v/maxTotal)*chartH;
      ctx.fillStyle = RESULT_COLOR[k];
      ctx.fillRect(x, yBase-hBar, barW, hBar);
      yBase -= hBar;
    });

    // Label mes
    ctx.fillStyle='#7A7468'; ctx.font='10px "DM Mono"'; ctx.textAlign='center';
    var parts = s.mes.split('-');
    var mesNombre = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(parts[1])-1];
    ctx.fillText(mesNombre+' '+parts[0].slice(2), x+barW/2, pad.t+chartH+16);
  });

  // Línea UF/m² promedio (eje secundario)
  if(preciosValidos.length>1 && maxPrecio>minPrecio){
    ctx.strokeStyle='#2D5BE3'; ctx.lineWidth=2;
    ctx.beginPath();
    var firstPoint=true;
    series.forEach(function(s,i){
      if(s.precioProm===null) return;
      var x = pad.l + barSlot*i + barSlot/2;
      var y = pad.t + chartH - ((s.precioProm-minPrecio)/(maxPrecio-minPrecio))*chartH;
      if(firstPoint){ ctx.moveTo(x,y); firstPoint=false; }
      else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // Puntos
    ctx.fillStyle='#2D5BE3';
    series.forEach(function(s,i){
      if(s.precioProm===null) return;
      var x = pad.l + barSlot*i + barSlot/2;
      var y = pad.t + chartH - ((s.precioProm-minPrecio)/(maxPrecio-minPrecio))*chartH;
      ctx.beginPath();
      ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fill();
    });

    // Eje secundario derecho (UF/m²)
    ctx.fillStyle='#2D5BE3'; ctx.font='10px "DM Mono"'; ctx.textAlign='left';
    ctx.fillText(round(maxPrecio,1), pad.l+chartW+6, pad.t+6);
    ctx.fillText(round(minPrecio,1), pad.l+chartW+6, pad.t+chartH);
  }
}

/* ============================================================
   HELPER: KPI CARD
   ============================================================ */
function kpiCard(label, value, unit, note, color, extraHtml){
  var cls = color ? 'kpi-card kpi-'+color : 'kpi-card';
  return '<div class="'+cls+'">'+
    '<div class="kpi-label">'+label+'</div>'+
    '<div class="kpi-value">'+value+(unit?'<span class="kpi-unit">'+unit+'</span>':'')+'</div>'+
    (extraHtml?extraHtml:'')+
    (note?'<div class="kpi-note">'+note+'</div>':'')+
  '</div>';
}

/* ============================================================
   PANEL DESLIZABLE: lengueta, abrir, cerrar, pinear
   ============================================================ */
var sidebarPinned = false;

function openSidebar(){
  var sb = document.getElementById('sidebar');
  var tab = document.getElementById('panel-tab');
  sb.classList.add('open');
  tab.classList.add('hidden');
  shiftMapControls(true);
}

function closeSidebar(){
  // Si está pineado, despinear primero
  if(sidebarPinned){
    sidebarPinned = false;
    document.getElementById('sidebar').classList.remove('pinned');
    document.getElementById('pin-btn').classList.remove('active');
  }
  var sb = document.getElementById('sidebar');
  var tab = document.getElementById('panel-tab');
  sb.classList.remove('open');
  tab.classList.remove('hidden');
  shiftMapControls(false);
  // Forzar recálculo del mapa
  setTimeout(function(){ if(map) map.invalidateSize(); }, 320);
}

function togglePin(){
  sidebarPinned = !sidebarPinned;
  var sb = document.getElementById('sidebar');
  var pinBtn = document.getElementById('pin-btn');
  if(sidebarPinned){
    sb.classList.add('pinned');
    pinBtn.classList.add('active');
  } else {
    sb.classList.remove('pinned');
    pinBtn.classList.remove('active');
  }
  // Forzar recálculo del mapa por si cambió el área visible
  setTimeout(function(){ if(map) map.invalidateSize(); }, 100);
}

function shiftMapControls(open){
  var mc = document.getElementById('map-controls');
  if(!mc) return;
  if(open) mc.classList.add('shifted');
  else mc.classList.remove('shifted');
}

/* ============================================================
   POPOVER DE FECHAS
   ============================================================ */
function toggleDatePopover(){
  var pop = document.getElementById('date-popover');
  pop.classList.toggle('open');
}

// Cerrar popover si clickea afuera
document.addEventListener('click', function(e){
  var pop = document.getElementById('date-popover');
  var btn = document.getElementById('date-btn');
  if(!pop || !btn) return;
  if(pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)){
    pop.classList.remove('open');
  }
});
</script>
